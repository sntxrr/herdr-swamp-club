name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck install.sh
        run: shellcheck -S style install.sh

      - name: theme file parses and carries every token
        run: |
          python3 - <<'PY'
          import tomllib
          with open("swamp-club.toml", "rb") as f:
              cfg = tomllib.load(f)
          want = {
              "accent", "panel_bg", "sidebar_bg", "active_row_bg", "selection_bg",
              "surface0", "surface1", "surface_dim", "overlay0", "overlay1",
              "text", "subtext0", "mauve", "green", "yellow", "red", "blue",
              "teal", "peach",
          }
          got = set(cfg["theme"]["custom"])
          assert got == want, f"missing={want-got} extra={got-want}"
          import re
          bad = [k for k, v in cfg["theme"]["custom"].items()
                 if not re.fullmatch(r"#[0-9a-f]{6}", v)]
          assert not bad, f"non-hex values: {bad}"
          print(f"ok: {len(got)} tokens, all #rrggbb")
          PY

      - name: install.sh round-trips a config that already has a theme
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          printf 'onboarding = false\n[theme]\nname = "dracula"\n\n[theme.custom]\naccent = "#ff0000"\n\n[ui]\nsidebar_width = 30\n' > "$tmp"
          ./install.sh --config "$tmp"
          python3 - "$tmp" <<'PY'
          import sys, tomllib
          cfg = tomllib.load(open(sys.argv[1], "rb"))
          assert cfg["theme"]["name"] == "catppuccin"
          assert cfg["theme"]["custom"]["accent"] == "#39ff14"
          assert cfg["ui"]["sidebar_width"] == 30, "unrelated table was lost"
          assert cfg["onboarding"] is False
          print("ok: old theme replaced, other tables intact")
          PY

      - name: sounds are real mp3s
        run: |
          python3 - <<'PY'
          for name in ("done", "request"):
              with open(f"sounds/{name}.mp3", "rb") as f:
                  head = f.read(3)
              # an ID3 tag, or a bare MPEG frame sync
              assert head == b"ID3" or (head[0] == 0xFF and head[1] & 0xE0 == 0xE0), f"{name}.mp3 is not an mp3"
          print("ok: done.mp3 and request.mp3 are mp3s")
          PY

      - name: install.sh points [ui.sound] at the sounds, and --no-sounds leaves it alone
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          printf '[ui.sound]\nenabled = false\ndone_path = "mine.mp3"\n\n[ui.sound.agents]\ndroid = "off"\n' > "$dir/config.toml"
          ./install.sh --config "$dir/config.toml"
          ./install.sh --config "$dir/config.toml"   # twice: must not duplicate keys
          bare="$(mktemp -d)"
          printf '[ui]\nsidebar_width = 30\n' > "$bare/config.toml"
          ./install.sh --no-sounds --config "$bare/config.toml"
          python3 - "$dir" "$bare" <<'PY'
          import os, sys, tomllib
          d, bare = sys.argv[1], sys.argv[2]
          sound = tomllib.load(open(f"{d}/config.toml", "rb"))["ui"]["sound"]
          assert sound["done_path"] == "sounds/swamp-club-done.mp3", sound
          assert sound["request_path"] == "sounds/swamp-club-request.mp3", sound
          assert sound["enabled"] is False, "the user's enabled setting was overwritten"
          assert sound["agents"] == {"droid": "off"}, "[ui.sound.agents] was lost"
          for key in ("done_path", "request_path"):
              assert os.path.getsize(os.path.join(d, sound[key])) > 0
          assert "sound" not in tomllib.load(open(f"{bare}/config.toml", "rb"))["ui"]
          assert not os.path.exists(f"{bare}/sounds"), "--no-sounds still copied files"
          print("ok: sounds wired in, user settings kept, --no-sounds respected")
          PY
